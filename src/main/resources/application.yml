spring:
  application:
    name: supermarket-management-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.txwaptqrhfygsqxkihez.supabase.co:5432/postgres?sslmode=verify-full}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
